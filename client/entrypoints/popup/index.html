<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HashTrust</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>HashTrust</h1>
      <span id="mode-badge" class="badge"></span>
    </header>

    <section>
      <h2>This page</h2>
      <div id="page"><p class="muted">Loading…</p></div>
    </section>

    <section>
      <h2>Domain <span id="domain-name" class="muted"></span></h2>
      <div id="domain"><p class="muted">Loading…</p></div>
    </section>

    <section id="account-section" hidden>
      <h2>Account</h2>
      <div id="account"></div>
      <form id="sign-in" hidden>
        <input type="email" name="email" placeholder="you@example.com" required />
        <button type="submit">Sign in</button>
      </form>
      <p id="sign-in-status" class="muted"></p>
    </section>

    <details>
      <summary>Settings</summary>
      <form id="settings">
        <fieldset>
          <legend>Backend</legend>
          <label><input type="radio" name="backendMode" value="mock" /> Mock (stored locally)</label>
          <label><input type="radio" name="backendMode" value="remote" /> Remote</label>
          <label><input type="radio" name="backendMode" value="local" /> Local index (page content stays in the browser)</label>
          <input type="url" name="backendUrl" placeholder="http://localhost:8000" />
        </fieldset>
        <label><input type="checkbox" name="sendExcerpt" /> Send selected text with votes</label>
        <label><input type="checkbox" name="highlight" /> Highlight flagged content</label>
        <label><input type="checkbox" name="sendHits" /> Send detection reports (local index)</label>
        <div class="row">
          <button type="button" id="rescan">Rescan page</button>
          <button type="button" id="clear-mock" class="danger">Clear mock data</button>
        </div>
      </form>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
