<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Konklaavi</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <h1>Konklaavi</h1>
      <span id="mode-badge" class="pill"></span>
    </header>

    <section>
      <div class="row">
        <h2>On this page</h2>
        <button type="button" id="refresh" title="Pull the latest notes and look this page up again">Refresh</button>
      </div>
      <div id="page"><p class="muted">Loading…</p></div>
    </section>

    <section id="account-section">
      <h2>Account</h2>
      <div id="account"><p class="muted">Loading…</p></div>
      <button type="button" id="sign-out" hidden>Sign out</button>
      <form id="sign-in" hidden>
        <div class="fields">
          <input type="email" name="email" placeholder="you@example.com" autocomplete="email" aria-label="Email" required />
          <input type="password" name="password" placeholder="Password, 8 characters or more" autocomplete="current-password" aria-label="Password" minlength="8" required />
        </div>
        <div class="inline">
          <button type="submit" name="action" value="login" class="primary">Sign in</button>
          <button type="submit" name="action" value="register">Create account</button>
        </div>
        <p id="sign-in-status" class="error" role="alert"></p>
      </form>
    </section>

    <details>
      <summary>What the highlights mean</summary>
      <ul id="legend" class="legend"></ul>
      <p class="muted">Lighter highlights matched by meaning rather than by wording.</p>
    </details>

    <details>
      <summary>Settings</summary>
      <form id="settings">
        <fieldset>
          <legend>Matching</legend>
          <label class="option"><input type="radio" name="backendMode" value="local" /><span><b>Local index</b>Matches on this device; page text stays in the browser.</span></label>
          <label class="option"><input type="radio" name="backendMode" value="remote" /><span><b>Remote</b>Sends sentence hashes to the backend.</span></label>
          <label class="option"><input type="radio" name="backendMode" value="mock" /><span><b>Mock</b>Notes stored in this browser, for trying the interface.</span></label>
          <input type="url" name="backendUrl" placeholder="http://localhost:8000" aria-label="Backend URL" />
        </fieldset>
        <label class="toggle"><input type="checkbox" name="highlight" /> Highlight tracked passages</label>
        <label class="toggle"><input type="checkbox" name="showAll" /> Show all highlights (including content readers found accurate)</label>
        <label class="toggle"><input type="checkbox" name="sendHits" /> Report where narratives appear (local index)</label>
        <div class="buttons">
          <button type="button" id="rescan">Rescan page</button>
          <button type="button" id="benchmark" title="Time on-device embedding on each available path, in a new tab">Benchmark embeddings</button>
          <button type="button" id="clear-mock" class="danger">Clear mock notes</button>
        </div>
        <p id="clear-confirm" class="muted" hidden>
          Delete every mock note and rating? <button type="button" id="clear-yes" class="danger">Delete</button>
          <button type="button" id="clear-no">Keep</button>
        </p>
      </form>
    </details>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
