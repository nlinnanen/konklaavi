# The overnight run: 100 readers across 49 sites, 85 honest, with nine trolls and a six-member brigade.
# At about 0.57 credits per note decision and 0.21 per batch of three ratings they spend about 280 credits
# an hour. Fact-checkers read across the spectrum, camp_a leans to mainstream and liberal outlets and
# camp_b to sceptical ones, each with one outlet of the other side, trolls read accurate outlets, and the
# brigade reads accurate outlets to flag and hyperpartisan ones to defend.
domain: crowd.hashtrust.test

