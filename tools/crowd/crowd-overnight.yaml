# The overnight run: 60 readers, mostly honest, with four trolls and a five-member brigade. At about
# 0.45 credits per note decision and 0.13 per batch of three ratings, they spend about 100 credits an hour.
domain: crowd.hashtrust.test

sites:
  rt:
    feeds:
      - https://www.rt.com/rss/news/
      - https://www.rt.com/rss/russia/
      - https://www.rt.com/rss/business/
      - https://www.rt.com/rss/op-ed/
  sputnik:
    feeds:
      - https://sputnikglobe.com/export/rss2/archive/index.xml
  yle:
    feeds:
      - https://feeds.yle.fi/uutiset/v1/recent.rss?publisherIds=YLE_NEWS
  bbc:
    feeds:
      - https://feeds.bbci.co.uk/news/world/rss.xml
      - https://feeds.bbci.co.uk/news/rss.xml

