[project]
name = "trust-dashboard"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "streamlit",
  "psycopg[binary]",
  "pandas",
  "httpx",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["ruff"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]
