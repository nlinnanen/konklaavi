name: deploy

on:
  push:
    branches: [deploy]
  workflow_dispatch:

# A deploy runs to the end; a push during it waits, and only the newest waiting push runs next.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER }}
      VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
      VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
      PUBLIC_URL: ${{ vars.PUBLIC_URL }}
    steps:
      - name: Check configuration
        run: |
          missing=()
          for name in VPS_HOST VPS_USER VPS_SSH_KEY VPS_KNOWN_HOSTS PUBLIC_URL; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing secrets or variables: ${missing[*]}. deploy/README.md lists the gh commands that set them."
            exit 1
          fi

      - name: Configure SSH
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Release on the VPS
        run: >-
          ssh -i ~/.ssh/deploy_key
          -o IdentitiesOnly=yes
          -o StrictHostKeyChecking=yes
          -o UserKnownHostsFile="$HOME/.ssh/known_hosts"
          -o ServerAliveInterval=30
          "$VPS_USER@$VPS_HOST" "$GITHUB_SHA"

      - name: Check the public health endpoint
        run: curl --fail --silent --show-error --retry 10 --retry-delay 6 --retry-all-errors --max-time 10 "${PUBLIC_URL%/}/api/health"
