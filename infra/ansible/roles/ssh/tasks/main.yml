- name: Check the admin can log in before root is locked out
  ansible.builtin.stat:
    path: /home/{{ admin_user }}/.ssh/authorized_keys
  register: ssh_admin_keys
  failed_when: not ssh_admin_keys.stat.exists or ssh_admin_keys.stat.size == 0

# sshd -t needs its privilege separation directory, which socket-activated ssh only creates on demand.
- name: Ensure sshd's runtime directory exists
  ansible.builtin.file:
    path: /run/sshd
    state: directory
    mode: "0755"

# sshd uses the first value it reads, and 00- sorts before cloud-init's 50-cloud-init.conf.
- name: Harden sshd
  ansible.builtin.template:
    src: 00-hardening.conf.j2
    dest: /etc/ssh/sshd_config.d/00-hardening.conf
    mode: "0644"
    validate: /usr/sbin/sshd -t -f %s
  notify: Restart ssh

- name: Check the full sshd configuration
  ansible.builtin.command: /usr/sbin/sshd -t
  changed_when: false

# The old pipeline logged in as root with a key forced to run deploy/release.sh.
- name: Remove the old root deploy key
  ansible.builtin.lineinfile:
    path: /root/.ssh/authorized_keys
    regexp: release\.sh
    state: absent
