[project]
name = "konklaavi-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "psycopg[binary,pool]",
  "pgvector",
  "httpx",
  "trafilatura",
  "anthropic",
  "numpy",
  "scikit-learn",
  "networkx",
  "argon2-cffi>=25.1.0",
  "jinja2>=3.1.6",
  "python-multipart>=0.0.33",
]

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls a paid external API; runs only when its key is set"]
