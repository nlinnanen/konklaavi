x-backend: &backend
  build: ./backend
  image: ${COMPOSE_PROJECT_NAME:-junction26}-backend
  environment:
    - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
    - FP_URL=http://fingerprint:8100
    # The Hostinger AI Router serves the Anthropic Messages API.
    - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-${HOSTINGER_ROUTER_KEY:-}}
    - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-https://router.hostinger.com}
    - ANALYSIS_MODEL=${ANALYSIS_MODEL:-claude-opus-5.5}
    - PARAPHRASE_MODEL=${PARAPHRASE_MODEL:-claude-haiku-5.5}
  depends_on:
    db:
      condition: service_healthy
    fingerprint:
      condition: service_started
  init: true
  restart: unless-stopped

services:
  db:
    image: timescale/timescaledb-ha:pg17
    environment:
      POSTGRES_PASSWORD: postgres
      # timescaledb-tune panics where the container has no cgroup memory.max, aborting initdb.
      NO_TS_TUNE: "true"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pgdata:/home/postgres/pgdata/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  fingerprint:
    build:
      context: .
      dockerfile: fingerprint-service/Dockerfile
    image: ${COMPOSE_PROJECT_NAME:-junction26}-fingerprint
    ports:
      - "${FP_PORT:-8100}:8100"
    volumes:
      - models:/models
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:8100/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2m
    init: true
    restart: unless-stopped

  api:
    <<: *backend
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2m

  worker:
    <<: *backend
    command: ["python", "-m", "app.worker"]
    # A job longer than the allowed heartbeat age marks the worker unhealthy until it finishes.
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, tempfile, time; sys.exit(time.time() - os.path.getmtime(os.path.join(tempfile.gettempdir(), 'worker-heartbeat')) > 300)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 2m

  dashboard:
    build: ./dashboard
    image: ${COMPOSE_PROJECT_NAME:-junction26}-dashboard
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/postgres
      - API_URL=http://api:8000
      - EVAL_RESULTS=/eval/latest.json
    volumes:
      - ./backend/app/eval/results:/eval:ro
    ports:
      - "${DASH_PORT:-8501}:8501"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501/_stcore/health', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 1m
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: unless-stopped

volumes:
  pgdata:
  models:
