[project]
name = "trust-simulation"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["httpx"]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
extend-select = ["I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["."]
